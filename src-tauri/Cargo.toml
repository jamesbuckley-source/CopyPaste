[package]
name = "copypaste"
version = "0.13.22"
description = "Clipboard history manager with local plain-text storage"
authors = ["CopyPaste"]
edition = "2024"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "copypaste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# Local dates for Markdown note filenames and front matter.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# The GIF utility searches and downloads from GIPHY. Uses the rustls stack that
# the updater already brings in, so no system TLS dependency is added.
reqwest = { version = "0.13", features = ["json", "query"] }

# Storage. `bundled` compiles SQLite from source so there is no external
# dependency on a system sqlite3.dll.
rusqlite = { version = "0.40", features = ["bundled"] }

# Legacy decryption for histories written before plain-text storage. No new data
# is encrypted; the key file is removed after the one-time migration.
aes-gcm = "0.10"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
base64 = "0.22"

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Face detection runs a vendored YuNet ONNX model on this interpreter: pure Rust,
# so the installer stays a single self-contained exe with no runtime to ship.
tract = { version = "0.23", default-features = false, features = ["onnx"] }
ndarray = "0.16"

arboard = "3.7"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
# Blocks on the WinRT async operation that drives text recognition.
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics_Imaging",
  "Win32_Media_Audio",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Storage_Xps",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Intentionally NOT `panic = "abort"`: a panic on the clipboard-watcher thread
# should terminate only that thread, not the whole background app.
strip = true
